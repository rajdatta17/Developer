name: Refresh Daybreak data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-daybreak-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh provider data and briefing
        env:
          DAYBREAK_LOCATION_NAME: ${{ vars.DAYBREAK_LOCATION_NAME || 'New York' }}
          DAYBREAK_LATITUDE: ${{ vars.DAYBREAK_LATITUDE || '40.7128' }}
          DAYBREAK_LONGITUDE: ${{ vars.DAYBREAK_LONGITUDE || '-74.0060' }}
          DAYBREAK_TIMEZONE: ${{ vars.DAYBREAK_TIMEZONE || 'America/New_York' }}
          WEATHER_PROVIDER: open-meteo
          CRICKET_PROVIDER: mock
          FOOTBALL_PROVIDER: mock
          CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: npm run data:refresh

      - name: Validate generated data
        run: npm run data:validate

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh Daybreak feeds"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch Pages deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

